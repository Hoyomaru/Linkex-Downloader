name: Publish v1.2.1

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v1.2.1.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_SHA: ac698e0d3d8f6a6e6ba876cf2ea64e8cc98e1ac5
      TAG: v1.2.1
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Verify exact release source
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          grep -q '^// @version      1\.2\.1$' linkex-downloader.user.js
          grep -q "const VERSION = '1.2.1';" linkex-downloader.user.js
          node --check linkex-downloader.user.js
          node --test tests/*.test.js
          python tools/check_repo_consistency.py

      - name: Build release assets
        run: python tools/build_release_assets.py --output-dir dist

      - name: Prepare release notes and checksums
        run: |
          USER_JS="dist/linkex_downloader_v1.2.1.user.js"
          ZIP="dist/linkex_downloader_v1.2.1.zip"
          test -f "$USER_JS"
          test -f "$ZIP"
          cp docs/releases/v1.2.1.md "$RUNNER_TEMP/release-notes.md"
          {
            echo
            echo '## 公開Asset検証値'
            echo
            echo '```text'
            printf '%s  %s bytes  sha256:%s\n' "$(basename "$USER_JS")" "$(wc -c < "$USER_JS" | tr -d ' ')" "$(sha256sum "$USER_JS" | cut -d' ' -f1)"
            printf '%s  %s bytes  sha256:%s\n' "$(basename "$ZIP")" "$(wc -c < "$ZIP" | tr -d ' ')" "$(sha256sum "$ZIP" | cut -d' ' -f1)"
            echo '```'
            echo
            echo "Release commit: \`$RELEASE_SHA\`"
          } >> "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite."
            exit 1
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "Linkex Downloader v1.2.1" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            dist/linkex_downloader_v1.2.1.user.js \
            dist/linkex_downloader_v1.2.1.zip

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,url,targetCommitish,assets
          test "$(git rev-parse "$TAG^{commit}")" = "$RELEASE_SHA"

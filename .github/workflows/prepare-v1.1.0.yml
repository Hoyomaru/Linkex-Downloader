name: Prepare v1.1.0

on:
  push:
    branches:
      - release/v1.1.0

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.head_commit.message == 'chore: fix v1.1.0 release preparation workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare version, artifacts, and release docs
        run: python tools/prepare_v1_1_0.py

      - name: Verify userscript syntax
        run: node --check linkex-downloader.user.js

      - name: Run regression tests
        run: node --test tests/*.test.js

      - name: Verify v1.0.0 fixed artifacts remain unchanged
        run: git diff --exit-code origin/main -- linkex_downloader_v1.0.0.user.js linkex_downloader_v1.0.0.zip

      - name: Keep workflow changes out of the generated commit
        run: rm -f .github/workflows/publish-v1.1.0.yml

      - name: Commit prepared release
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "release: prepare Linkex Downloader v1.1.0"
          git push origin HEAD:release/v1.1.0

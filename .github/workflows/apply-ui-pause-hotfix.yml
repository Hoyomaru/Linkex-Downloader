name: Apply UI and pause hotfix

on:
  push:
    branches:
      - fix/ui-viewport-and-pause

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply hotfix
        run: python tools/apply_ui_pause_hotfix.py
      - name: Syntax check
        run: node --check linkex-downloader.user.js
      - name: Regression tests
        run: node --test tests/*.test.js
      - name: Commit hotfix and remove temporary tooling
        run: |
          rm -f tools/apply_ui_pause_hotfix.py .github/workflows/apply-ui-pause-hotfix.yml
          rmdir tools 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep panel visible and enable safe pause"
          git push

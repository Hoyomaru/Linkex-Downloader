name: Refine share-page mode

on:
  push:
    branches:
      - feat/share-page-mode
    paths:
      - .github/workflows/apply-share-page-mode.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply race guards and credential refresh
        run: python tools/refine_share_page_mode.py

      - name: Syntax check userscript
        run: node --check linkex-downloader.user.js

      - name: Run regression tests
        run: node --test tests/*.test.js

      - name: Verify v1.1.0 fixed artifacts remain unchanged
        run: git diff --exit-code origin/main -- linkex_downloader_v1.1.0.user.js linkex_downloader_v1.1.0.zip

      - name: Commit refinements
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add linkex-downloader.user.js tests/linkex-downloader.test.js DEVELOPMENT.md
          git status --short
          git commit -m "fix: guard share-page context changes"
          git push origin HEAD:feat/share-page-mode

name: one-shot-v13-buffered-writer

"on":
  push:
    branches:
      - exp/v1.3-buffered-writer
    paths:
      - '.github/workflows/v13-buffered-writer-bootstrap.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: exp/v1.3-buffered-writer

      - name: Apply buffered writer experiment
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          src_path = Path('linkex-downloader.user.js')
          src = src_path.read_text(encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, got {count}')
              return text.replace(old, new, 1)

          src = replace_once(
              src,
              "  const CHECKPOINT_INTERVAL_MS = 1000;\n  const UI_UPDATE_INTERVAL_MS = 750;\n  const PERFORMANCE_SCHEMA_VERSION = 1;",
              "  const CHECKPOINT_INTERVAL_MS = 1000;\n  const UI_UPDATE_INTERVAL_MS = 750;\n  const WRITE_BUFFER_BYTES = 4 * 1024 * 1024;\n  const PERFORMANCE_SCHEMA_VERSION = 1;",
              'writer buffer constant',
          )

          src = replace_once(
              src,
              "  function formatTransferRate(value) {\n    const n = Number(value || 0);\n    if (!Number.isFinite(n) || n <= 0) return '0 B/s';\n    return `${formatBytes(n)}/s`;\n  }\n\n  function buildPerformanceSummary(job) {",
              "  function formatTransferRate(value) {\n    const n = Number(value || 0);\n    if (!Number.isFinite(n) || n <= 0) return '0 B/s';\n    return `${formatBytes(n)}/s`;\n  }\n\n  function mergeWriteBufferChunks(chunks, totalBytes) {\n    const total = Number(totalBytes || 0);\n    if (!Number.isFinite(total) || total < 0) throw new LinkexError('書き込みバッファサイズが不正です。', {kind:'filesystem'});\n    if (total === 0) return new Uint8Array(0);\n    if (chunks.length === 1 && Number(chunks[0]?.byteLength || 0) === total) return chunks[0];\n    const merged = new Uint8Array(total);\n    let offset = 0;\n    for (const chunk of chunks) {\n      const size = Number(chunk?.byteLength || 0);\n      if (!size) continue;\n      if (offset + size > total) throw new LinkexError('書き込みバッファの合計サイズが不一致です。', {kind:'filesystem'});\n      merged.set(chunk, offset);\n      offset += size;\n    }\n    if (offset !== total) throw new LinkexError('書き込みバッファの合計サイズが不一致です。', {kind:'filesystem'});\n    return merged;\n  }\n\n  function buildPerformanceSummary(job) {",
              'writer buffer merge helper',
          )

          old_loop = """      const reader = res.body.getReader();
      let written = base;
      let nextCheckpoint = written + CHECKPOINT_BYTES;
      let lastCheckpointAt = transferStartedAt;
      let lastUi = 0;
      try {
        while (true) {
          const {done, value} = await reader.read();
          if (done) break;
          if (!value?.byteLength) continue;
          await writable.write(value);
          written += value.byteLength;
          const now = Date.now();
          const elapsedMs = Math.max(1, now - transferStartedAt);
          const transferredBytes = Math.max(0, written - transferStartBytes);
          const averageBytesPerSecond = transferredBytes * 1000 / elapsedMs;
          if (now - lastRateAt >= 250) {
            const deltaMs = Math.max(1, now - lastRateAt);
            instantBytesPerSecond = Math.max(0, written - lastRateBytes) * 1000 / deltaMs;
            peakBytesPerSecond = Math.max(peakBytesPerSecond, instantBytesPerSecond);
            lastRateAt = now;
            lastRateBytes = written;
          }
          if (written >= nextCheckpoint || now - lastCheckpointAt >= CHECKPOINT_INTERVAL_MS) {
            const current = loadProbeState() || state;
            saveProbeState({...current, state:'DOWNLOADING', download:{...(current.download||{}), destId, downloadedBytes:written, expectedCdnBytes:expectedTotal, telemetry:{transferStartedAt, transferStartBytes, transferredBytes, elapsedMs, averageBytesPerSecond, averageMBps:bytesPerSecondToMBps(averageBytesPerSecond), instantBytesPerSecond, peakBytesPerSecond, resumed}, updatedAt:now}});
            nextCheckpoint = written + CHECKPOINT_BYTES;
            lastCheckpointAt = now;
          }
          if (now - lastUi >= UI_UPDATE_INTERVAL_MS) {
            onProgress({written, expectedTotal, resumed, sourceMetaSize:Number(state.source?.size || 0), averageBytesPerSecond, instantBytesPerSecond, peakBytesPerSecond});
            lastUi = now;
          }
        }
        await writable.close();
"""
          new_loop = """      const reader = res.body.getReader();
      let written = base;
      let received = base;
      let bufferedChunks = [];
      let bufferedBytes = 0;
      let nextCheckpoint = written + CHECKPOINT_BYTES;
      let lastCheckpointAt = transferStartedAt;
      let lastUi = 0;

      async function flushBufferedWrite() {
        if (!bufferedBytes) return;
        const batchBytes = bufferedBytes;
        const batch = mergeWriteBufferChunks(bufferedChunks, batchBytes);
        await writable.write(batch);
        written += batchBytes;
        bufferedChunks = [];
        bufferedBytes = 0;
      }

      try {
        while (true) {
          const {done, value} = await reader.read();
          if (done) break;
          if (!value?.byteLength) continue;
          bufferedChunks.push(value);
          bufferedBytes += value.byteLength;
          received += value.byteLength;

          let now = Date.now();
          if (bufferedBytes >= WRITE_BUFFER_BYTES || now - lastCheckpointAt >= CHECKPOINT_INTERVAL_MS) {
            await flushBufferedWrite();
            now = Date.now();
          }

          const elapsedMs = Math.max(1, now - transferStartedAt);
          const transferredBytes = Math.max(0, received - transferStartBytes);
          const averageBytesPerSecond = transferredBytes * 1000 / elapsedMs;
          if (now - lastRateAt >= 250) {
            const deltaMs = Math.max(1, now - lastRateAt);
            instantBytesPerSecond = Math.max(0, received - lastRateBytes) * 1000 / deltaMs;
            peakBytesPerSecond = Math.max(peakBytesPerSecond, instantBytesPerSecond);
            lastRateAt = now;
            lastRateBytes = received;
          }
          if (written >= nextCheckpoint || now - lastCheckpointAt >= CHECKPOINT_INTERVAL_MS) {
            if (bufferedBytes) {
              await flushBufferedWrite();
              now = Date.now();
            }
            const current = loadProbeState() || state;
            saveProbeState({...current, state:'DOWNLOADING', download:{...(current.download||{}), destId, downloadedBytes:written, expectedCdnBytes:expectedTotal, telemetry:{transferStartedAt, transferStartBytes, transferredBytes, elapsedMs, averageBytesPerSecond, averageMBps:bytesPerSecondToMBps(averageBytesPerSecond), instantBytesPerSecond, peakBytesPerSecond, resumed}, updatedAt:now}});
            nextCheckpoint = written + CHECKPOINT_BYTES;
            lastCheckpointAt = now;
          }
          if (now - lastUi >= UI_UPDATE_INTERVAL_MS) {
            onProgress({written:received, expectedTotal, resumed, sourceMetaSize:Number(state.source?.size || 0), averageBytesPerSecond, instantBytesPerSecond, peakBytesPerSecond});
            lastUi = now;
          }
        }
        await flushBufferedWrite();
        await writable.close();
"""
          src = replace_once(src, old_loop, new_loop, 'download write loop')
          src_path.write_text(src, encoding='utf-8')

          docs_path = Path('docs/PERFORMANCE.md')
          docs = docs_path.read_text(encoding='utf-8')
          anchor = "`exp/v1.3-cadence` changes only checkpoint/UI cadence for the first A/B candidate: checkpoint after 16 MiB **or** 1000 ms (whichever is reached first on a received chunk), UI refresh every 750 ms, while the 250 ms transfer-rate sampling remains unchanged for comparability.\n"
          addition = anchor + """

Cadence A/B follow-up: the candidate measured 38.52 MiB/s and the immediate baseline rerun measured 36.90 MiB/s. That +4.4% paired difference is smaller than the observed baseline drift; the candidate is almost exactly the midpoint of the two most recent baseline runs (40.19 and 36.90 MiB/s). Treat cadence as throughput-neutral and keep it because it substantially reduces checkpoint/UI update frequency without changing verification or deletion gates.

`exp/v1.3-buffered-writer` adds a 4 MiB multi-chunk write buffer on top of the cadence candidate. Checkpoints only persist bytes that have actually been flushed to the File System Access writable stream. Unflushed JS-buffer bytes are intentionally discarded on interruption so the resume offset cannot overstate durable local progress.
"""
          if anchor not in docs:
              raise SystemExit('cadence docs anchor not found')
          docs = docs.replace(anchor, addition, 1)
          docs = docs.replace(
              "| Checkpoint cadence | 2 MiB | 16 MiB or 1000 ms | candidate implemented; A/B pending |\n| UI update cadence | ~250 ms | 750 ms | candidate implemented; A/B pending |\n| Writer behavior | per stream chunk | buffered multi-chunk writes | pending |",
              "| Checkpoint cadence | 2 MiB | 16 MiB or 1000 ms | throughput-neutral; keep |\n| UI update cadence | ~250 ms | 750 ms | throughput-neutral; keep |\n| Writer behavior | per stream chunk | 4 MiB buffered multi-chunk writes | candidate implemented; A/B pending |",
              1,
          )
          docs_path.write_text(docs, encoding='utf-8')

          test_path = Path('tests/performance-buffered-writer.test.js')
          test_path.write_text("""'use strict';

const test = require('node:test');
const assert = require('node:assert/strict');
const fs = require('node:fs');
const vm = require('node:vm');
const {webcrypto} = require('node:crypto');
const {TextEncoder} = require('node:util');

const SOURCE_PATH = 'linkex-downloader.user.js';
const SOURCE = fs.readFileSync(SOURCE_PATH, 'utf8');
const STARTUP = \"  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', createPanel, {once:true});\\n  else createPanel();\\n})();\";
const EXPOSE = \"  globalThis.__writerTest = {mergeWriteBufferChunks};\\n})();\";

function loadRuntime() {
  assert.ok(SOURCE.includes(STARTUP), 'test harness could not find userscript startup block');
  const storage = new Map();
  const context = {
    console,
    TextEncoder,
    URL,
    URLSearchParams,
    Uint8Array,
    AbortController,
    setTimeout,
    clearTimeout,
    setInterval,
    clearInterval,
    crypto:webcrypto,
    navigator:{language:'ja-JP'},
    location:new URL('https://disk.linkex.io/'),
    localStorage:{length:0,key(){return null;},getItem(){return null;}},
    atob(value) { return Buffer.from(String(value), 'base64').toString('binary'); },
    window:{},
    unsafeWindow:{},
    document:{readyState:'loading', addEventListener(){}},
    GM_getValue(key, fallback) { return storage.has(key) ? storage.get(key) : fallback; },
    GM_setValue(key, value) { storage.set(key, value); },
    GM_xmlhttpRequest() { throw new Error('unexpected GM_xmlhttpRequest'); },
    fetch:async () => { throw new Error('unexpected fetch'); },
  };
  vm.createContext(context);
  vm.runInContext(SOURCE.replace(STARTUP, EXPOSE), context, {filename:SOURCE_PATH});
  return context.__writerTest;
}

test('buffered writer batches at 4 MiB while preserving cadence controls', () => {
  assert.match(SOURCE, /const WRITE_BUFFER_BYTES = 4 \\* 1024 \\* 1024;/);
  assert.match(SOURCE, /bufferedBytes >= WRITE_BUFFER_BYTES/);
  assert.match(SOURCE, /await flushBufferedWrite\\(\\);/);
  assert.match(SOURCE, /downloadedBytes:written/);
  assert.match(SOURCE, /onProgress\\(\\{written:received,/);
});

test('mergeWriteBufferChunks preserves byte order', () => {
  const api = loadRuntime();
  const merged = api.mergeWriteBufferChunks([
    new Uint8Array([1, 2]),
    new Uint8Array([3]),
    new Uint8Array([4, 5, 6]),
  ], 6);
  assert.deepEqual(Array.from(merged), [1, 2, 3, 4, 5, 6]);
});
""", encoding='utf-8')
          PY

      - name: Verify buffered writer experiment
        shell: bash
        run: |
          node --check linkex-downloader.user.js
          node --test tests/*.test.js
          python tools/check_repo_consistency.py
          python tools/build_release_assets.py --output-dir "$RUNNER_TEMP/linkex-release"

      - name: Commit verified buffered writer experiment
        shell: bash
        run: |
          rm .github/workflows/v13-buffered-writer-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf: add buffered browser writes experiment"
          git push origin HEAD:exp/v1.3-buffered-writer

name: Apply review follow-ups

on:
  push:
    branches:
      - fix/review-priority-1-6
    paths:
      - tools/apply-review-followups.py
      - .github/workflows/apply-review-followups.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/review-priority-1-6
          fetch-depth: 0
      - name: Apply follow-up patches
        run: python3 tools/apply-review-followups.py
      - name: Syntax check
        run: node --check linkex-downloader.user.js
      - name: Existing regression tests
        run: node --test tests/*.test.js
      - name: Remove one-off patch machinery
        run: |
          rm -f tools/apply-review-followups.py
          rm -f .github/workflows/apply-review-followups.yml
          rmdir tools 2>/dev/null || true
      - name: Commit follow-up changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: improve queue recovery and maintenance"
          git push origin HEAD:fix/review-priority-1-6

name: one-shot-v13-telemetry

on:
  push:
    branches:
      - 'feat/v1.3-performance'
    paths:
      - '.github/workflows/v13-telemetry-bootstrap.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/v1.3-performance
      - name: Apply telemetry patch
        run: |
          python tools/apply_v13_telemetry.py
          python tools/fix_v13_telemetry_test.py
      - name: Verify implementation
        run: |
          node --check linkex-downloader.user.js
          node --test tests/*.test.js
          python tools/check_repo_consistency.py
          python tools/build_release_assets.py --output-dir "$RUNNER_TEMP/linkex-release"
      - name: Commit verified implementation
        run: |
          rm .github/workflows/v13-telemetry-bootstrap.yml
          rm tools/apply_v13_telemetry.py
          rm tools/fix_v13_telemetry_test.py
          rm -f docs/.ci-probe
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add v1.3 performance telemetry"
          git push origin HEAD:feat/v1.3-performance

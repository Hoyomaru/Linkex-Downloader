name: one-shot-v13-telemetry

on:
  push:
    branches:
      - dev/v1.3-performance
    paths:
      - '.github/workflows/v13-telemetry-bootstrap.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev/v1.3-performance

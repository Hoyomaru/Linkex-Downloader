name: Prepare v1.2.1 release

on:
  push:
    branches:
      - release/v1.2.1
    paths:
      - .github/workflows/release-prep-v1.2.1.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: release/v1.2.1
          fetch-depth: 0
      - name: Apply release updates
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def sub_once(text, pattern, repl, label, flags=0):
              out, n = re.subn(pattern, repl, text, count=1, flags=flags)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 replacement, got {n}')
              return out

          # Userscript version markers.
          p = 'linkex-downloader.user.js'
          s = read(p)
          s = sub_once(s, r'(?m)^// @version\s+1\.2\.0$', '// @version      1.2.1', 'metadata version')
          s = sub_once(s, r"const VERSION = '1\.2\.0';", "const VERSION = '1.2.1';", 'runtime version')
          write(p, s)

          # Changelog: promote the existing Unreleased fix into 1.2.1.
          p = 'CHANGELOG.md'
          s = read(p)
          needle = "## [Unreleased]\n\n### Fixed\n\n- CDNが `Content-Length` を公開しない正常応答でも、streamの正常EOF到達とローカル書き込みbyte数を証拠として安全に完了できるよう修正。Range 416で完成サイズを取得できない場合は曖昧なlocal fileを完成扱いせず0 byteから再取得する\n"
          repl = "## [Unreleased]\n\n## [1.2.1] - 2026-09-17\n\n### Fixed\n\n- CDNが `Content-Length` を公開しない正常応答でも、streamの正常EOF到達とローカル書き込みbyte数を証拠として安全に完了できるよう修正。Range 416で完成サイズを取得できない場合は曖昧なlocal fileを完成扱いせず0 byteから再取得する\n"
          if needle not in s:
              raise SystemExit('CHANGELOG release block not found')
          write(p, s.replace(needle, repl, 1))

          # README: main source becomes the 1.2.1 release candidate; public stable stays 1.2.0 until publication.
          p = 'README.md'
          s = read(p)
          s = sub_once(s, r'- `main` source: \*\*v1\.2\.0\*\*（公開済み / 実機確認済み）', '- `main` source: **v1.2.1**（Release準備中 / 実機確認済み）', 'README main version')
          s = sub_once(s, r'v1\.2\.0 までの開発過程で、以下が実機確認済みとして記録されています。', 'v1.2.1 までの開発過程で、以下が実機確認済みとして記録されています。', 'README verification version')
          s = sub_once(s, r'- CDN実サイズ基準のローカル保存検証', '- Content-Lengthがある場合はCDN実サイズ一致、ない場合はstream正常EOF＋実書込byte数でローカル保存検証', 'README verification feature')
          write(p, s)

          # DEVELOPMENT: version state + safety invariant + delete guards.
          p = 'DEVELOPMENT.md'
          s = read(p)
          s = sub_once(s, r'2026-09-15 時点で確認した状態です。', '2026-09-17 時点で確認した状態です。', 'DEVELOPMENT state date')
          s = sub_once(s, r'- `main` source: \*\*v1\.2\.0\*\*（公開済み / 実機確認済み）', '- `main` source: **v1.2.1**（Release準備中 / 実機確認済み）', 'DEVELOPMENT main version')
          s = sub_once(s, r'- userscript metadata `@version`: \*\*1\.2\.0\*\*', '- userscript metadata `@version`: **1.2.1**', 'DEVELOPMENT metadata version')
          s = sub_once(s, r'- `const VERSION`: \*\*1\.2\.0\*\*', '- `const VERSION`: **1.2.1**', 'DEVELOPMENT runtime version')
          s = sub_once(s, r'      └─ v1\.2\.0\.md', '      ├─ v1.2.0.md\n      └─ v1.2.1.md', 'DEVELOPMENT tree')
          s = sub_once(s, r'9\. ローカル検証済みサイズとCDN実サイズが一致しない場合は削除拒否。', "9. Content-Lengthが得られる場合はローカル検証済みサイズとCDN実サイズの一致を要求する。Content-Lengthが得られない場合は `verificationMethod === 'stream-eof'`、正常EOF、stream実書込byte数と最終ローカルサイズ一致を要求する。", 'DEVELOPMENT invariant 9')
          s = sub_once(s, r'- `downloadedBytes === expectedCdnBytes >= 0`\n- 新規transactionでは `download\.sizeVerified === true`', "- `verificationMethod === 'content-length'` の場合は `downloadedBytes === expectedCdnBytes >= 0` かつ `download.sizeVerified === true`\n- `verificationMethod === 'stream-eof'` の場合は `streamComplete === true` かつstream実書込byte数と最終ローカルサイズが一致", 'DEVELOPMENT delete guards')
          s = s.replace('現行main（v1.2.0 release candidate）', '現行main（v1.2.1 release candidate）')
          write(p, s)

          # Architecture: document both verification paths.
          p = 'docs/ARCHITECTURE.md'
          s = read(p)
          s = sub_once(s, r'K\[ローカルへRange対応DL\]\n    K --> L\[CDN実サイズで検証\]', 'K[ローカルへRange対応DL]\n    K --> L[Content-Length / stream EOFで検証]', 'ARCHITECTURE diagram')
          s = sub_once(s, r'\| ダウンロード \| signed URL、Range resume、checkpoint、サイズ検証 \|', '| ダウンロード | signed URL、Range resume、checkpoint、Content-Length / stream EOF検証 |', 'ARCHITECTURE component')
          old = "6. 最終ローカルサイズと CDN の実サイズを照合。\n7. 一致した場合だけ `LOCAL_COMMITTED`。"
          new = "6. `Content-Length` が得られる場合は最終ローカルサイズと CDN 実サイズを厳密照合。得られない場合はstreamの正常EOF、stream実書込byte数、最終ローカルサイズの一致を照合。\n7. どちらかの検証方式が成立した場合だけ `LOCAL_COMMITTED`。"
          if old not in s:
              raise SystemExit('ARCHITECTURE download verification block not found')
          s = s.replace(old, new, 1)
          old = "- `download.sizeVerified === true`\n- `downloadedBytes === expectedCdnBytes >= 0`（明示検証済み0 byteを含む）"
          new = "- `download.verificationMethod === 'content-length'` の場合は `download.sizeVerified === true` かつ `downloadedBytes === expectedCdnBytes >= 0`\n- `download.verificationMethod === 'stream-eof'` の場合は `streamComplete === true` かつstream実書込byte数と最終ローカルサイズが一致"
          if old not in s:
              raise SystemExit('ARCHITECTURE delete guard block not found')
          s = s.replace(old, new, 1)
          write(p, s)

          # Release procedure: main source is RC until publication, and safety checks include stream EOF evidence.
          p = 'docs/RELEASE.md'
          s = read(p)
          s = sub_once(s, r'2026-09-15 時点:', '2026-09-17 時点:', 'RELEASE date')
          s = sub_once(s, r'- `main` source: \*\*v1\.2\.0\*\*（公開済み / 実機確認済み）', '- `main` source: **v1.2.1**（Release準備中 / 実機確認済み）', 'RELEASE main version')
          old = "- `download.sizeVerified === true`\n- `downloadedBytes === expectedCdnBytes >= 0` を満たし `verifiedAt` がある場合だけdelete可能"
          new = "- Content-Length検証では `download.sizeVerified === true` かつ `downloadedBytes === expectedCdnBytes >= 0`\n- Content-Lengthがない場合は `verificationMethod === 'stream-eof'`、`streamComplete === true`、stream実書込byte数と最終ローカルサイズ一致を満たし、いずれも `verifiedAt` がある場合だけdelete可能"
          if old not in s:
              raise SystemExit('RELEASE safety block not found')
          s = s.replace(old, new, 1)
          write(p, s)

          # Consistency checks must validate the new documented invariant instead of the v1.2.0-only rule.
          p = 'tools/check_repo_consistency.py'
          s = read(p)
          old = "require('download.sizeVerified === true' in arch, 'ARCHITECTURE missing sizeVerified delete guard')\nrequire('downloadedBytes === expectedCdnBytes >= 0' in arch, 'ARCHITECTURE zero-byte delete guard is stale')\nrequire('downloadedBytes === expectedCdnBytes > 0' not in arch, 'ARCHITECTURE still contains obsolete > 0 guard')"
          new = "require(\"download.verificationMethod === 'content-length'\" in arch, 'ARCHITECTURE missing content-length verification guard')\nrequire(\"download.verificationMethod === 'stream-eof'\" in arch, 'ARCHITECTURE missing stream-eof verification guard')\nrequire('streamComplete === true' in arch, 'ARCHITECTURE missing stream EOF completion guard')\nrequire('downloadedBytes === expectedCdnBytes >= 0' in arch, 'ARCHITECTURE zero-byte content-length guard is stale')\nrequire('downloadedBytes === expectedCdnBytes > 0' not in arch, 'ARCHITECTURE still contains obsolete > 0 guard')"
          if old not in s:
              raise SystemExit('consistency architecture checks not found')
          write(p, s.replace(old, new, 1))

          # Version-specific release notes. Asset hashes are appended/verified when publishing the tag.
          p = Path('docs/releases/v1.2.1.md')
          if p.exists():
              raise SystemExit('v1.2.1 release note already exists')
          p.write_text("""# Linkex Downloader v1.2.1 — Content-LengthなしCDN応答への対応

v1.2.1は、CDNが `Content-Length` を公開しない正常応答でQueueが停止する問題を修正するpatch releaseです。v1.2.0の所有権確認・単一ID削除・write再送禁止などの安全条件は維持します。

> [!IMPORTANT]
> 本ツールはLinkex公式とは無関係の非公式ツールです。Linkex側のWeb / API / CDN仕様変更により将来動作しなくなる可能性があります。

## 修正内容

- CDN応答に `Content-Length` がある場合は、従来どおり期待CDN byte数と最終ローカルサイズを厳密照合します。
- `Content-Length` がない場合は、streamの正常EOF到達・stream実書込byte数・最終ローカルサイズの一致を検証し、`verificationMethod: stream-eof` として完了できます。
- stream途中切断やreader例外は `DOWNLOAD_PAUSED` とし、`LOCAL_COMMITTED` にはしません。
- Range再開時にHTTP 416となり、追加probeでも総byte数を得られない場合は、曖昧なローカルファイルを完成扱いせず0 byteから安全に再取得します。
- Linkex metadataの `size` をCDN実サイズの代替には使用しません。
- DONE transaction compact化後も `verificationMethod` / `streamComplete` を保持します。

## 削除安全条件

一時コピーの自動DELETEは `LOCAL_COMMITTED` 後だけです。

- Content-Length方式: `sizeVerified === true` かつ `downloadedBytes === expectedCdnBytes >= 0`
- stream EOF方式: `verificationMethod === 'stream-eof'`、`streamComplete === true`、stream実書込byte数と最終ローカルサイズが一致
- どちらも `verifiedAt` が必要
- ownership確定済み `destId` だけを `select_all:false` + 単一 `file_ids:[destId]` で削除

stream EOF方式は、サーバーが明示する総byte数との独立照合ではなく、正常なtransport EOFと実書込byte数を完全性証拠として使用します。Content-Lengthが得られる場合は従来の厳密なsize一致を優先します。

## 回帰テスト

次のケースを追加・確認しています。

- Content-Lengthなし + 正常EOF → `LOCAL_COMMITTED`
- Content-Lengthなし + stream途中切断 → `DOWNLOAD_PAUSED`、未commit
- Range 416 + probeでもContent-Lengthなし → 0 byteから再取得しstream EOF検証
- 既存の0 byte / 416既知サイズ / ownership変更 / lease / retryケース

## 実機確認

2026-09-17に、実際に `Content-Length` 不在で停止していたファイルを含むQueueで修正版の動作確認を実施済みです。

## インストール / 更新

GitHub Release `v1.2.1` の `linkex_downloader_v1.2.1.user.js` を推奨Assetとします。ZIPは同じuserscriptを1ファイルだけ含む補助Assetです。

未完了Queueがある場合は、可能なら更新前に安全停止してからuserscriptを更新してください。

## SHA-256

Release対象commitから `tools/build_release_assets.py` で生成したAssetのSHA-256を公開時にGitHub Release Asset digestと照合します。
""", encoding='utf-8')
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/release-prep-v1.2.1.yml
      - name: Validate release candidate
        run: |
          node --check linkex-downloader.user.js
          node --test tests/*.test.js
          python tools/check_repo_consistency.py
          python tools/build_release_assets.py --output-dir "$RUNNER_TEMP/linkex-release"
      - name: Commit release preparation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: prepare v1.2.1"
          git push origin HEAD:release/v1.2.1

name: Prepare v1.2.0

on:
  push:
    branches:
      - release/v1.2.0
    paths:
      - .github/workflows/prepare-v1.2.0.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply v1.2.0 preparation
        run: python tools/prepare_v1_2_0.py

      - name: Keep existing CI workflow for Actions-token push
        run: git checkout origin/main -- .github/workflows/ci.yml

      - name: Stage generated repository state for consistency checks
        run: git add -A

      - name: Syntax check userscript
        run: node --check linkex-downloader.user.js

      - name: Run regression tests
        run: node --test tests/*.test.js

      - name: Check repository consistency
        run: python tools/check_repo_consistency.py

      - name: Build deterministic release assets
        run: python tools/build_release_assets.py --output-dir "$RUNNER_TEMP/linkex-release"

      - name: Show release asset hashes
        run: |
          sha256sum "$RUNNER_TEMP"/linkex-release/*
          ls -lh "$RUNNER_TEMP"/linkex-release

      - name: Remove temporary preparation tooling and commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/prepare_v1_2_0.py .github/workflows/prepare-v1.2.0.yml
          git add -A
          git status --short
          git commit -m "release: prepare Linkex Downloader v1.2.0"
          git push origin HEAD:release/v1.2.0

name: Apply collapsible log UI

on:
  push:
    branches:
      - fix/collapsible-log-ui
    paths:
      - .github/workflows/apply-collapsible-log-ui.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply UI patch
        run: python tools/apply_collapsible_log_ui.py

      - name: Syntax check userscript
        run: node --check linkex-downloader.user.js

      - name: Run regression tests
        run: node --test tests/*.test.js

      - name: Verify fixed release artifacts remain unchanged
        run: git diff --exit-code origin/main -- linkex_downloader_v1.1.0.user.js linkex_downloader_v1.1.0.zip

      - name: Commit implementation and remove temporary tooling
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add linkex-downloader.user.js tests/linkex-downloader.test.js CHANGELOG.md docs/QUICK_DOWNLOAD_UI.md
          git rm .github/workflows/apply-collapsible-log-ui.yml tools/apply_collapsible_log_ui.py
          git status --short
          git commit -m "fix: collapse verbose status log by default"
          git push origin HEAD:fix/collapsible-log-ui

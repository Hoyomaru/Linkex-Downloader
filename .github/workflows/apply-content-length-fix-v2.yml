name: Apply Content-Length compatibility fix v2

on:
  push:
    branches:
      - fix/content-length-stream-eof
    paths:
      - .github/workflows/apply-content-length-fix-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/content-length-stream-eof
          fetch-depth: 0

      - name: Patch downloader and tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          source_path = Path('linkex-downloader.user.js')
          tests_path = Path('tests/linkex-downloader.test.js')
          source = source_path.read_text(encoding='utf-8')
          tests = tests_path.read_text(encoding='utf-8')

          replacements = []

          replacements.append((
              'source',
              'generalize download verification',
              r"  function commitVerifiedDownload\(state, \{destId, downloadedBytes, expectedCdnBytes, localName\}\) \{.*?\n  \}\n\n  async function downloadOwnedFile",
              r'''  function commitVerifiedDownload(state, {destId, downloadedBytes, expectedCdnBytes = null, localName, verificationMethod = 'content-length'}) {
            const downloaded = Number(downloadedBytes);
            if (!Number.isFinite(downloaded) || downloaded < 0) {
              throw new LinkexError(`ダウンロード済みサイズが不正です: ${downloadedBytes}`, {kind:'verify', actual:downloadedBytes});
            }

            let expected = null;
            let sizeVerified = false;
            let streamComplete = false;
            if (verificationMethod === 'content-length') {
              expected = Number(expectedCdnBytes);
              if (!Number.isFinite(expected) || expected < 0 || downloaded !== expected) {
                throw new LinkexError(`サイズ検証失敗: local=${downloadedBytes} / CDN=${expectedCdnBytes}`, {kind:'verify', actual:downloadedBytes, expectedTotal:expectedCdnBytes});
              }
              sizeVerified = true;
            } else if (verificationMethod === 'stream-eof') {
              streamComplete = true;
            } else {
              throw new LinkexError(`未対応のダウンロード検証方式です: ${verificationMethod}`, {kind:'verify'});
            }

            const current = loadProbeState() || state;
            return saveProbeState({...current, state:'LOCAL_COMMITTED', download:{...(current.download||{}), destId, downloadedBytes:downloaded, expectedCdnBytes:expected, sizeVerified, verificationMethod, streamComplete, sourceMetaSize:Number(state.source?.size || 0), verifiedAt:Date.now(), localName}});
          }

          async function downloadOwnedFile'''
          ))

          replacements.append((
              'source',
              'Range 416 fallback',
              r"      if \(res\.status === 416\) \{.*?\n      \}\n\n      if \(!\(res\.status === 200 \|\| res\.status === 206\)\)",
              r'''      if (res.status === 416) {
                try { await res.body?.cancel(); } catch {}
                let total;
                try {
                  total = await probeCdnTotalSize(url);
                } catch (e) {
                  // Range resumeの完成サイズをContent-Lengthで確認できない場合は、
                  // 曖昧なlocal fileを完成扱いせず0 byteから安全に取り直す。
                  if (offset > 0 && e?.kind === 'protocol') {
                    const w = await handle.createWritable({keepExistingData:false});
                    await w.truncate(0); await w.close();
                    offset = 0;
                    retried403 = false;
                    continue;
                  }
                  throw e;
                }
                localFile = await handle.getFile();
                if (localFile.size === total) {
                  const done = commitVerifiedDownload(state, {destId, downloadedBytes:localFile.size, expectedCdnBytes:total, localName:localFile.name});
                  return {verified:true, resumed:true, totalBytes:total, localBytes:localFile.size, status:'ALREADY_COMPLETE', state:done};
                }
                if (localFile.size > total) {
                  const w = await handle.createWritable({keepExistingData:false});
                  await w.truncate(0); await w.close();
                  offset = 0;
                  retried403 = false;
                  continue;
                }
                throw new LinkexError(`Range 416ですがローカルサイズが完成サイズと一致しません (${localFile.size}/${total})`, {kind:'range_416', localSize:localFile.size, total});
              }

              if (!(res.status === 200 || res.status === 206))'''
          ))

          replacements.append((
              'source',
              'allow missing Content-Length',
              r"      const rawRemaining = res\.headers\.get\('Content-Length'\);.*?\n      const writable =",
              r'''      const rawRemaining = res.headers.get('Content-Length');
              const remaining = rawRemaining === null ? null : Number(rawRemaining);
              const hasKnownLength = remaining !== null && Number.isFinite(remaining) && remaining >= 0;
              let resumed = offset > 0 && res.status === 206;
              let base = resumed ? offset : 0;

              // Rangeを要求したのに200ならサーバーが無視したとみなし、同じ200 bodyを0から保存。
              if (offset > 0 && res.status === 200) {
                base = 0;
                resumed = false;
                offset = 0;
              }

              // Content-LengthがCORS等で見えない正常応答では、HTTP streamが正常EOFまで
              // 到達したことを完全性証拠として扱う。metadata sizeはCDN実サイズと異なるため使わない。
              const expectedTotal = hasKnownLength ? base + remaining : null;
              const verificationMethod = hasKnownLength ? 'content-length' : 'stream-eof';
              const writable ='''
          ))

          replacements.append((
              'source',
              'commit stream EOF verification',
              r"      const finalFile = await handle\.getFile\(\);.*?return \{verified:true, resumed, totalBytes:expectedTotal, localBytes:actual, finalFile, state:done, metadataSize:Number\(state\.source\?\.size \|\| 0\)\};",
              r'''      const finalFile = await handle.getFile();
              const actual = finalFile.size;
              // writableへ渡したbyte数と最終ファイルサイズは、Content-Length有無に関係なく一致必須。
              if (actual !== written) {
                const current = loadProbeState() || state;
                saveProbeState({...current, state:'VERIFY_FAILED', download:{...(current.download||{}), destId, downloadedBytes:actual, expectedCdnBytes:expectedTotal, sizeVerified:false, verificationMethod, streamComplete:false, updatedAt:Date.now()}});
                throw new LinkexError(`ローカル書き込み検証失敗: file=${actual} / written=${written}`, {kind:'verify', actual, written});
              }
              if (hasKnownLength && actual !== expectedTotal) {
                const current = loadProbeState() || state;
                saveProbeState({...current, state:'VERIFY_FAILED', download:{...(current.download||{}), destId, downloadedBytes:actual, expectedCdnBytes:expectedTotal, sizeVerified:false, verificationMethod, streamComplete:false, updatedAt:Date.now()}});
                throw new LinkexError(`サイズ検証失敗: local=${actual} / CDN=${expectedTotal}`, {kind:'verify', actual, expectedTotal});
              }

              const done = commitVerifiedDownload(state, {destId, downloadedBytes:actual, expectedCdnBytes:expectedTotal, localName:finalFile.name, verificationMethod});
              return {verified:true, resumed, totalBytes:expectedTotal ?? actual, localBytes:actual, finalFile, state:done, verificationMethod, metadataSize:Number(state.source?.size || 0)};'''
          ))

          replacements.append((
              'source',
              'accept stream EOF delete evidence',
              r"  function assertDeleteGuards\(state\) \{.*?\n  \}\n\n  function sameOwnedIdentity",
              r'''  function assertDeleteGuards(state) {
            if (!state || state.state !== 'LOCAL_COMMITTED') {
              throw new LinkexError('削除条件を満たしていません: state が LOCAL_COMMITTED ではありません。', {kind:'delete_guard'});
            }
            const destId = String(state.confirmedDest?.id || '');
            if (!destId) throw new LinkexError('削除条件を満たしていません: confirmedDest.id がありません。', {kind:'delete_guard'});
            if (state.state === 'AMBIGUOUS_COPY') throw new LinkexError('AMBIGUOUS_COPY は削除できません。', {kind:'delete_guard'});
            if (!Array.isArray(state.beforeIds)) throw new LinkexError('削除条件を満たしていません: コピー前ID集合がありません。', {kind:'delete_guard'});
            if (state.beforeIds.map(String).includes(destId)) {
              throw new LinkexError('削除拒否: destId がコピー前から存在していました。所有権を証明できません。', {kind:'delete_guard'});
            }
            if (String(state.download?.destId || '') !== destId) {
              throw new LinkexError('削除拒否: ダウンロード検証IDとコピー所有IDが一致しません。', {kind:'delete_guard'});
            }
            const downloaded = Number(state.download?.downloadedBytes);
            const expectedRaw = state.download?.expectedCdnBytes;
            const expected = expectedRaw == null ? null : Number(expectedRaw);
            const explicitSizeVerified = state.download?.sizeVerified === true;
            // v1.0.0で既にLOCAL_COMMITTEDになった正サイズ(>0) Queueは互換維持する。
            // 0 byteは新実装の明示的sizeVerifiedがある場合だけ許可する。
            const legacySizeVerified = state.download?.sizeVerified == null && downloaded > 0 && expected > 0 && downloaded === expected;
            const sizeEvidenceValid = (explicitSizeVerified || legacySizeVerified) && Number.isFinite(downloaded) && Number.isFinite(expected) && downloaded >= 0 && expected >= 0 && downloaded === expected;
            const streamEofVerified = state.download?.verificationMethod === 'stream-eof' && state.download?.streamComplete === true && Number.isFinite(downloaded) && downloaded >= 0;
            if (!(sizeEvidenceValid || streamEofVerified)) {
              throw new LinkexError(`削除拒否: ローカルダウンロードの完全性が確定していません (${downloaded}/${expected ?? 'EOF'})。`, {kind:'delete_guard'});
            }
            if (!Number(state.download?.verifiedAt || 0)) {
              throw new LinkexError('削除拒否: verifiedAt がありません。', {kind:'delete_guard'});
            }
            return streamEofVerified ? {destId, downloaded, expected:null, verificationMethod:'stream-eof'} : {destId, downloaded, expected};
          }

          function sameOwnedIdentity'''
          ))

          replacements.append((
              'source',
              'preserve compact verification evidence',
              r"    const download = tx\.download \? \{.*?\n    \} : null;",
              r'''    const download = tx.download ? {
              destId:tx.download.destId,
              downloadedBytes:Number(tx.download.downloadedBytes ?? 0),
              expectedCdnBytes:tx.download.expectedCdnBytes == null ? null : Number(tx.download.expectedCdnBytes),
              sizeVerified:tx.download.sizeVerified ?? null,
              verificationMethod:tx.download.verificationMethod ?? (tx.download.sizeVerified === true ? 'content-length' : null),
              streamComplete:tx.download.streamComplete === true,
              sourceMetaSize:Number(tx.download.sourceMetaSize ?? tx.source?.size ?? 0),
              verifiedAt:tx.download.verifiedAt ?? null,
              localName:tx.download.localName ?? null
            } : null;'''
          ))

          replacements.append((
              'tests',
              'replace missing Content-Length regression coverage',
              r"test\('missing Content-Length never becomes LOCAL_COMMITTED'.*?(?=test\('download refuses a destId whose identity changed after ownership confirmation')",
              r'''test('missing Content-Length completes only after a normal stream EOF and is safe to delete', async () => {
            const {api, context} = loadRuntime();
            const owned = {id: 'd1', name: 'file.bin', size: 10, url: 'https://cdn.example/file'};
            const state = {state: 'OWNERSHIP_CONFIRMED', confirmedDest: {id: 'd1', name: 'file.bin', size: 10}, source: {size: 10}};
            let size = 0;
            const handle = {
              async queryPermission() { return 'granted'; },
              async getFile() { return {size, name: 'file.bin'}; },
              async createWritable() {
                return {
                  async seek() {},
                  async truncate(n) { size = n; },
                  async write(value) { size += value?.byteLength || 0; },
                  async close() {},
                };
              },
            };
            const chunks = [new Uint8Array([1,2,3]), new Uint8Array([4,5])];
            let index = 0;
            context.fetch = async () => response({
              status: 200,
              length: null,
              reader: {
                async read() { return index < chunks.length ? {done:false, value:chunks[index++]} : {done:true}; },
                async cancel() {},
              },
            });

            const result = await api.downloadOwnedFile({api: ownedApi(owned), state, handle});
            assert.equal(result.state.state, 'LOCAL_COMMITTED');
            assert.equal(result.state.download.downloadedBytes, 5);
            assert.equal(result.state.download.expectedCdnBytes, null);
            assert.equal(result.state.download.sizeVerified, false);
            assert.equal(result.state.download.verificationMethod, 'stream-eof');
            assert.equal(result.state.download.streamComplete, true);
            assert.doesNotThrow(() => api.assertDeleteGuards({...result.state, beforeIds: []}));
          });

          test('missing Content-Length stream interruption remains resumable and never commits', async () => {
            const {api, context, storage} = loadRuntime();
            const owned = {id: 'd1', name: 'file.bin', size: 10, url: 'https://cdn.example/file'};
            const state = {state: 'OWNERSHIP_CONFIRMED', confirmedDest: {id: 'd1', name: 'file.bin', size: 10}, source: {size: 10}};
            let size = 0;
            const handle = {
              async queryPermission() { return 'granted'; },
              async getFile() { return {size, name: 'file.bin'}; },
              async createWritable() {
                return {
                  async seek() {},
                  async truncate(n) { size = n; },
                  async write(value) { size += value?.byteLength || 0; },
                  async close() {},
                };
              },
            };
            let reads = 0;
            context.fetch = async () => response({
              status: 200,
              length: null,
              reader: {
                async read() {
                  reads += 1;
                  if (reads === 1) return {done:false, value:new Uint8Array([1,2,3])};
                  throw new Error('stream interrupted');
                },
                async cancel() {},
              },
            });

            await assert.rejects(() => api.downloadOwnedFile({api: ownedApi(owned), state, handle}), /stream interrupted/);
            assert.equal(storage.get('linkexCopyProbeStateV1')?.state, 'DOWNLOAD_PAUSED');
            assert.notEqual(storage.get('linkexCopyProbeStateV1')?.state, 'LOCAL_COMMITTED');
          });

          test('Range 416 without a probe Content-Length restarts from zero and verifies by stream EOF', async () => {
            const {api, context} = loadRuntime();
            const owned = {id: 'd1', name: 'file.bin', size: 10, url: 'https://cdn.example/file'};
            const state = {state: 'DOWNLOAD_PAUSED', confirmedDest: {id: 'd1', name: 'file.bin', size: 10}, source: {size: 10}};
            let size = 5;
            let fetchCalls = 0;
            const handle = {
              async queryPermission() { return 'granted'; },
              async getFile() { return {size, name: 'file.bin'}; },
              async createWritable() {
                return {
                  async seek() {},
                  async truncate(n) { size = n; },
                  async write(value) { size += value?.byteLength || 0; },
                  async close() {},
                };
              },
            };
            context.fetch = async (_url, options = {}) => {
              fetchCalls += 1;
              if (fetchCalls === 1) {
                assert.equal(options.headers?.Range, 'bytes=5-');
                return response({status: 416, length: null, reader: {async read() { return {done:true}; }}});
              }
              if (fetchCalls === 2) {
                assert.equal(options.headers?.Range, undefined);
                return response({status: 200, length: null, reader: {async read() { return {done:true}; }}});
              }
              assert.equal(options.headers?.Range, undefined);
              let sent = false;
              return response({status: 200, length: null, reader: {
                async read() {
                  if (!sent) { sent = true; return {done:false, value:new Uint8Array([1,2,3,4])}; }
                  return {done:true};
                },
                async cancel() {},
              }});
            };

            const result = await api.downloadOwnedFile({api: ownedApi(owned), state, handle});
            assert.equal(fetchCalls, 3);
            assert.equal(result.state.download.downloadedBytes, 4);
            assert.equal(result.state.download.verificationMethod, 'stream-eof');
            assert.equal(result.state.download.streamComplete, true);
          });

          '''
          ))

          report = []
          for target, label, pattern, _replacement in replacements:
              text = source if target == 'source' else tests
              count = len(re.findall(pattern, text, flags=re.S))
              report.append(f'{label}: {count}')

          bad = [line for line in report if not line.endswith(': 1')]
          if bad:
              Path('patch-preflight.txt').write_text('\n'.join(report) + '\n', encoding='utf-8')
              print('\n'.join(report))
          else:
              for target, label, pattern, replacement in replacements:
                  if target == 'source':
                      source, count = re.subn(pattern, lambda _m, r=replacement: r, source, count=1, flags=re.S)
                  else:
                      tests, count = re.subn(pattern, lambda _m, r=replacement: r, tests, count=1, flags=re.S)
                  assert count == 1, label
              source_path.write_text(source, encoding='utf-8')
              tests_path.write_text(tests, encoding='utf-8')

              changelog = Path('CHANGELOG.md')
              text = changelog.read_text(encoding='utf-8')
              marker = '## [Unreleased]\n'
              bullet = "\n### Fixed\n\n- CDNが `Content-Length` を公開しない正常応答でも、streamの正常EOF到達とローカル書き込みbyte数を証拠として安全に完了できるよう修正。Range 416で完成サイズを取得できない場合は曖昧なlocal fileを完成扱いせず0 byteから再取得する\n"
              if marker not in text:
                  raise SystemExit('CHANGELOG Unreleased marker not found')
              changelog.write_text(text.replace(marker, marker + bullet, 1), encoding='utf-8')
          PY

      - name: Validate patch
        if: ${{ hashFiles('patch-preflight.txt') == '' }}
        run: |
          node --check linkex-downloader.user.js
          node --test tests/*.test.js
          python tools/check_repo_consistency.py
          python tools/build_release_assets.py --output-dir "$RUNNER_TEMP/linkex-release"

      - name: Commit diagnostics or fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -f patch-preflight.txt ]]; then
            git add patch-preflight.txt
            git commit -m "chore: record patch preflight"
            git push origin HEAD:fix/content-length-stream-eof
            exit 0
          fi
          git rm .github/workflows/apply-content-length-fix-v2.yml
          git add linkex-downloader.user.js tests/linkex-downloader.test.js CHANGELOG.md
          git commit -m "fix: support CDN responses without Content-Length"
          git push origin HEAD:fix/content-length-stream-eof

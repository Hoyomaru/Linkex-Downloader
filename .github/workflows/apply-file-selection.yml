name: Apply file selection feature

on:
  push:
    branches:
      - feat/file-selection-queue
    paths:
      - tools/apply-file-selection.py
      - .github/workflows/apply-file-selection.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/file-selection-queue
          fetch-depth: 0
      - name: Relax start-handler replacement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/apply-file-selection.py')
          s = p.read_text(encoding='utf-8')
          old = "rep(old_start, new_start, 'refactor start handlers')"
          new = """pattern = r\"    startBtn\\.addEventListener\\('click', async \\(\\) => \\{.*?(?=    resumeBtn\\.addEventListener\\('click')\"\nmatch = __import__('re').search(pattern, s, flags=__import__('re').S)\nif not match:\n    raise SystemExit('refactor start handlers: range not found')\ns = s[:match.start()] + new_start + '\\n' + s[match.end():]"""
          if s.count(old) != 1:
              raise SystemExit('could not find strict start-handler replacement')
          p.write_text(s.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
      - name: Apply selective queue patches
        run: python3 tools/apply-file-selection.py
      - name: Update regression tests for common queue starter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/linkex-downloader.test.js')
          s = p.read_text(encoding='utf-8')
          old_expose = "const EXPOSE = \"  globalThis.__linkexTest = {allocateLocalPaths, assertDeleteGuards, downloadOwnedFile, sameOwnedIdentity, LinkexApi, compactDoneTx};\\n})();\";"
          new_expose = "const EXPOSE = \"  globalThis.__linkexTest = {allocateLocalPaths, assertDeleteGuards, downloadOwnedFile, sameOwnedIdentity, LinkexApi, compactDoneTx, createQueueFromManifest};\\n})();\";"
          if s.count(old_expose) != 1:
              raise SystemExit('EXPOSE anchor mismatch')
          s = s.replace(old_expose, new_expose, 1)

          old_lease = '''test('queue start and resume acquire the lease before shared Queue mutations', () => {
            const startAt = SOURCE.indexOf("startBtn.addEventListener('click'");
            const resumeAt = SOURCE.indexOf("resumeBtn.addEventListener('click'");
            const pauseAt = SOURCE.indexOf("pauseBtn.addEventListener('click'");
            assert.ok(startAt > 0 && resumeAt > startAt && pauseAt > resumeAt);

            const startBlock = SOURCE.slice(startAt, resumeAt);
            assert.ok(startBlock.indexOf('await acquireLease();') >= 0);
            assert.ok(startBlock.indexOf('await acquireLease();') < startBlock.indexOf('saveQueueJob(job);'));

            const resumeBlock = SOURCE.slice(resumeAt, pauseAt);
            assert.ok(resumeBlock.indexOf('await acquireLease();') >= 0);
            assert.ok(resumeBlock.indexOf('await acquireLease();') < resumeBlock.indexOf('job.stopRequested = false;'));
            assert.ok(resumeBlock.indexOf('await acquireLease();') < resumeBlock.lastIndexOf('const job = loadQueueJob();'));
          });'''.replace('          ', '')
          new_lease = '''test('queue start and resume acquire the lease before shared Queue mutations', () => {
            const startAt = SOURCE.indexOf('async function startManifestQueue(selection = null)');
            const resumeAt = SOURCE.indexOf("resumeBtn.addEventListener('click'", startAt);
            const pauseAt = SOURCE.indexOf("pauseBtn.addEventListener('click'", resumeAt);
            assert.ok(startAt > 0 && resumeAt > startAt && pauseAt > resumeAt);

            const startBlock = SOURCE.slice(startAt, resumeAt);
            assert.ok(startBlock.indexOf('await acquireLease();') >= 0);
            assert.ok(startBlock.indexOf('await acquireLease();') < startBlock.indexOf('saveQueueJob(job);'));

            const resumeBlock = SOURCE.slice(resumeAt, pauseAt);
            assert.ok(resumeBlock.indexOf('await acquireLease();') >= 0);
            assert.ok(resumeBlock.indexOf('await acquireLease();') < resumeBlock.indexOf('job.stopRequested = false;'));
            assert.ok(resumeBlock.indexOf('await acquireLease();') < resumeBlock.lastIndexOf('const job = loadQueueJob();'));
          });'''.replace('          ', '')
          if s.count(old_lease) != 1:
              raise SystemExit('lease test anchor mismatch')
          s = s.replace(old_lease, new_lease, 1)

          old_boundary = "  const startAt = SOURCE.indexOf(\"startBtn.addEventListener('click'\", runAt);"
          new_boundary = "  const startAt = SOURCE.indexOf('async function startManifestQueue(selection = null)', runAt);"
          if s.count(old_boundary) != 1:
              raise SystemExit('runJob boundary anchor mismatch')
          s = s.replace(old_boundary, new_boundary, 1)

          addition = r'''

test('selected Queue contains only requested manifest indexes and recalculates total bytes', () => {
  const {api} = loadRuntime();
  const manifest = {
    shareToken: 'share-token',
    shareName: 'sample',
    totalBytes: 60,
    files: [
      {sourceId: 'a', name: 'a.bin', size: 10, remotePath: 'a.bin'},
      {sourceId: 'b', name: 'b.bin', size: 20, remotePath: 'folder/b.bin'},
      {sourceId: 'c', name: 'c.bin', size: 30, remotePath: 'c.bin'},
    ],
  };
  const selected = api.createQueueFromManifest(manifest, [1]);
  assert.equal(selected.selectionMode, 'selected');
  assert.equal(selected.sourceOriginalCount, 3);
  assert.equal(selected.items.length, 1);
  assert.equal(selected.items[0].manifestIndex, 1);
  assert.equal(selected.items[0].source.sourceId, 'b');
  assert.equal(selected.sourceTotalBytes, 20);

  const all = api.createQueueFromManifest(manifest);
  assert.equal(all.selectionMode, 'all');
  assert.equal(all.items.length, 3);
  assert.equal(all.sourceTotalBytes, 60);
});

test('selected Queue rejects an empty selection', () => {
  const {api} = loadRuntime();
  const manifest = {shareToken:'share-token', shareName:'sample', totalBytes:10, files:[{sourceId:'a', name:'a.bin', size:10, remotePath:'a.bin'}]};
  assert.throws(() => api.createQueueFromManifest(manifest, []), error => error?.kind === 'selection');
});
'''
          if "selected Queue contains only requested manifest indexes" not in s:
              s = s.rstrip() + addition
          p.write_text(s, encoding='utf-8', newline='\n')
          PY
      - name: Syntax check
        run: node --check linkex-downloader.user.js
      - name: Regression tests
        run: node --test tests/*.test.js
      - name: Remove one-off patch machinery
        run: |
          rm -f tools/apply-file-selection.py
          rm -f .github/workflows/apply-file-selection.yml
          rmdir tools 2>/dev/null || true
      - name: Commit feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add selective file queues"
          git push origin HEAD:feat/file-selection-queue
